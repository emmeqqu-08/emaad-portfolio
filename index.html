<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GitHub Pages SPA fallback decoder: if we arrived via 404.html's
         redirect (path stashed in the query as "/?/..."), rewrite the URL
         back to the real path before React Router boots. Must run first. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })();
    </script>

    <!-- Title and descriptions below are placeholders. scripts/site-meta.js
         replaces them with the values from Site Settings in the CMS. -->
    <meta name="description" content="Paintings, illustrations and photographs by Emaad." />
    <meta property="og:title" content="Emaad's portfolio" />
    <meta property="og:description" content="Paintings, illustrations and photographs by Emaad." />
    <meta property="og:type" content="website" />

    <!-- Fonts are self-hosted; see the imports at the top of src/main.jsx. -->

    <title>Emaad's portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
